{% extends "base.html" %}

{% block title %}Login - Barsha Digital Gift{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-primary text-white p-4 text-center">
                    <i class="bi bi-person-circle fs-1 mb-2"></i>
                    <h4 class="fw-bold mb-1">Welcome Back</h4>
                    <p class="text-white-50 small mb-0">Sign in to Barsha Digital Gifts Account</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold rounded-pill">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4 small">
                        Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
